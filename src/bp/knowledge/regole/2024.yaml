# Regole per i redditi 2024. Ogni blocco indica la fonte e come è stato verificato.

anno: 2024

irpef:
  fonte: D.Lgs. 216/2023 (tre scaglioni dal 2024)
  verificato: IRPEF del mese dei 10 cedolini 2024 (layout HR1LULDIP)
  scaglioni:          # limite superiore annuo (null = oltre) e aliquota %
    - {fino_a: 28000, aliquota: 23}
    - {fino_a: 50000, aliquota: 35}
    - {fino_a: null, aliquota: 43}

detrazione_lavoro_dipendente:
  fonte: art. 13 TUIR, come modificato dal D.Lgs. 216/2023
  verificato: detrazione del mese dei cedolini 01-08/2024; la maggiorazione non è verificata, il reddito stimato era sempre oltre 35.000
  # Importo annuo per fascia di reddito complessivo R: fisso + variabile * (limite - R) / ampiezza,
  # prima del rapporto con i giorni.
  fasce:
    - {fino_a: 15000, fisso: 1955, variabile: 0}
    - {fino_a: 28000, fisso: 1910, variabile: 1190, limite: 28000, ampiezza: 13000}
    - {fino_a: 50000, fisso: 0, variabile: 1910, limite: 50000, ampiezza: 22000}
    - {fino_a: null, fisso: 0, variabile: 0}
  # Comma 1.1 dell'art. 13 TUIR: 65 € in più per redditi oltre 25.000 e fino a 35.000 €.
  maggiorazione: {oltre: 25000, fino_a: 35000, importo: 65}

inps:
  fonte: aliquote a carico del dipendente; il layout HR1LULDIP le stampa intere, quindi valgono quelle stampate
  aliquote_dipendente:   # % per codice contributo
    "005": 9.19     # FPLD/IVS
    "006": 1.00     # IVS aggiuntivo oltre la prima fascia pensionabile
    "035": 0.30     # CIGS
    "124": 0.26667  # FIS, un terzo dello 0,80%; stampata 0,267

tfr:
  fonte: art. 2120 c.c.; contributo L. 297/1982
  divisore: 13.5
  contributo_rivalsa: 0.50   # % dell'imponibile previdenziale, sottratta dalla quota TFR

ente_bilaterale:
  fonte: cedolini PAYLUL01 09-12/2024, imponibile fiscale ricalcolato al centesimo; nel layout HR1LULDIP la quota è stampata (riga C/Ditta) e si usa quella
  aliquota_azienda: 0   # nel 2024 la quota dell'azienda non entra nell'imponibile fiscale; dal 2025 sì (0,10%)

fringe_benefit:
  fonte: Legge 213/2023, art. 1 comma 16 (solo 2024)
  soglia: 1000
  soglia_con_figli: 2000
